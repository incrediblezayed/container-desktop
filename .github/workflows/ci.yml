name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test ContainerKit
        run: swift test --package-path Packages/ContainerKit
      - name: Build app
        run: xcodebuild -project ContainerDesktop.xcodeproj -scheme ContainerDesktop -configuration Release -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
